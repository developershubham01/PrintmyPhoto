name: Build and Verify

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Next.js build
      run: npm run build
      env:
        NEXT_PUBLIC_SITE_URL: https://printmyphoto.vercel.app
        NEXT_PUBLIC_ADSENSE_ENABLED: 1
        NEXT_PUBLIC_ADSENSE_CLIENT: ca-pub-2733238354385302

